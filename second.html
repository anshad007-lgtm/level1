
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">
        <div id="recipeDetails"></div>
    </div>

    <script>
        let params = new URLSearchParams(window.location.search);
        let id = params.get('id');

        fetch(`https://dummyjson.com/recipes/${id}`)
            .then(res => res.json())
            .then(recipe => {
                document.getElementById('recipeDetails').innerHTML = `
                    <div class="card">
                        <div class="row g-0">

                            <div class="col-md-5">
                                <img src="${recipe.image}"
                                     class="img-fluid rounded-start w-100"
                                     alt="${recipe.name}"
                                     style="height:100%; min-height:300px; object-fit:cover;">
                            </div>

                            <div class="col-md-7">
                                <div class="card-body">
                                    <h2>${recipe.name}</h2>

                                    <p><b>Cuisine:</b> ${recipe.cuisine}</p>
                                    <p><b>Difficulty:</b> ${recipe.difficulty}</p>
                                    <p><b>Prep Time:</b> ${recipe.prepTimeMinutes} minutes</p>
                                    <p><b>Cook Time:</b> ${recipe.cookTimeMinutes} minutes</p>
                                    <p><b>Servings:</b> ${recipe.servings}</p>
                                    <p><b>Rating:</b> ${recipe.rating}</p>

                                    <h4>Ingredients</h4>
                                    <ul>
                                        ${recipe.ingredients.map(item =>
                                            `<li>${item}</li>`
                                        ).join('')}
                                    </ul>

                                    <h4>Instructions</h4>
                                    <ol>
                                        ${recipe.instructions.map(item =>
                                            `<li class="mb-2">${item}</li>`
                                        ).join('')}
                                    </ol>
                                </div>
                            </div>

                        </div>
                    </div>
                `;
            })
            .catch(error => {
                document.getElementById('recipeDetails').innerHTML =
                    '<h3>Recipe not found!</h3>';
            });
    </script>

</body>
</html>
